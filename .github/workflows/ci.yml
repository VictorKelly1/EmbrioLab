# Integración continua: corre en cada PR y en cada push a main.
# `main` exige que el job «pruebas» pase antes de fusionar (protección de la rama).
# Los valores de aquí son solo de prueba: no hay secretos ni datos reales.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: embriolab
          POSTGRES_USER: embriolab
          POSTGRES_PASSWORD: embriolab-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U embriolab -d embriolab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: embriolab.settings.dev
      DJANGO_SECRET_KEY: solo-para-ci-no-es-un-secreto
      POSTGRES_DB: embriolab
      POSTGRES_USER: embriolab
      POSTGRES_PASSWORD: embriolab-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # Las mismas bibliotecas que instala el Dockerfile para WeasyPrint (PDF).
      - name: Bibliotecas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (formato)
        run: ruff format --check .

      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run

      # Settings de producción. Se tolera solo security.W021 (HSTS preload): se decide
      # con el cliente cuando haya dominio (CONTEXTO.md §6, semana 9). Cualquier otra
      # advertencia o error hace fallar la CI.
      - name: check --deploy
        env:
          DJANGO_SETTINGS_MODULE: embriolab.settings.prod
          DJANGO_ALLOWED_HOSTS: embriolab.ejemplo
          SITIO_URL: https://embriolab.ejemplo
          DJANGO_SECRET_KEY: ci-solo-para-revisar-el-despliegue-0a9s8d7f6g5h4j3k2l1z0x9c8v7b6n5m
        run: |
          salida=$(python manage.py check --deploy 2>&1) || true
          echo "$salida"
          # Si el comando ni siquiera corrió (settings rotos), también es un fallo.
          echo "$salida" | grep -q 'System check identified' || exit 1
          problemas=$(echo "$salida" | grep -E '\([a-z_]+\.[EW][0-9]+\)' | grep -v 'security.W021' || true)
          if [ -n "$problemas" ]; then
            echo "::error::check --deploy tiene problemas nuevos:"
            echo "$problemas"
            exit 1
          fi

      - name: pytest
        run: pytest -q
