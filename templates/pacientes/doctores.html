{% extends 'app.html' %}

{% block titulo %}Doctores · EmbrioLab{% endblock %}

{% block contenido %}
<div class="encabezado">
  <h1>Doctores</h1>
  <a class="boton boton--principal" href="{% url 'pacientes:doctor_crear' %}">Registrar doctor</a>
</div>

<form class="buscador" method="get" role="search"
      hx-get="{% url 'pacientes:doctores' %}" hx-target="#resultados" hx-push-url="true"
      hx-trigger="input changed delay:300ms from:input[name=q], submit">
  <div class="campo">
    <label for="buscar">Buscar por nombre</label>
    <input type="search" id="buscar" name="q" value="{{ termino }}" autocomplete="off">
  </div>
</form>

<div id="resultados">{% include 'pacientes/_doctores_resultados.html' %}</div>
{% endblock %}
