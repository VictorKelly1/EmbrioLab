[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "embriolab.settings.dev"
python_files = ["test_*.py"]
addopts = "--strict-markers"
